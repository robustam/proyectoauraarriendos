<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Usuario — Panel AuraArriendos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,500&family=Inter:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="../../css/styles.css?v=20260922">
</head>
<body>
<div class="admin-shell">
  <aside class="admin-sidebar">
    <a href="index.html" class="nav-brand"><span class="mark">A</span>AuraArriendos</a>
    <a href="index.html">🏠 Dashboard</a>
    <a href="propiedades.html">🏘️ Propiedades</a>
    <a href="usuarios.html" data-role="admin-only">👤 Usuarios</a>
    <a href="blog.html" data-role="admin-only">📝 Blog</a>
    <a href="mensajes.html" data-role="admin-only">📥 Inbox <span data-inbox-count></span></a>
    <a href="../index.html">↩ Volver al sitio</a>
    <div class="admin-user">
      <div class="cluster">
        <div style="width:34px;height:34px;border-radius:999px;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;" data-admin-user-initial>U</div>
        <div><strong style="display:block;font-size:.85rem;" data-admin-user-name>Usuario</strong><span style="font-size:.72rem;color:rgba(246,243,236,.6)" data-admin-user-role>Rol</span></div>
      </div>
      <button type="button" class="btn btn-ghost btn-sm btn-block mt-1" data-action="logout">Cerrar sesión</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <div>
        <p class="eyebrow">Gestión de usuarios</p>
        <h1 data-form-heading>Nuevo usuario</h1>
      </div>
      <a href="usuarios.html" class="btn btn-ghost">← Volver al listado</a>
    </div>

    <form class="admin-card" id="usuario-form" novalidate style="max-width:760px;">
      <div class="form-alert error hidden" data-form-alert></div>
      <div class="form-grid">
        <div class="form-row-2">
          <div class="form-field">
            <label for="u-run">RUN</label>
            <input type="text" id="u-run" minlength="7" maxlength="9" placeholder="19011022K" required>
            <p class="hint">Sin puntos ni guion. Entre 7 y 9 caracteres.</p>
          </div>
          <div class="form-field">
            <label for="u-fecha">Fecha de nacimiento (opcional)</label>
            <input type="date" id="u-fecha">
          </div>
        </div>
        <div class="form-row-2">
          <div class="form-field">
            <label for="u-nombre">Nombre</label>
            <input type="text" id="u-nombre" maxlength="50" required>
          </div>
          <div class="form-field">
            <label for="u-apellidos">Apellidos</label>
            <input type="text" id="u-apellidos" maxlength="100" required>
          </div>
        </div>
        <div class="form-row-2">
          <div class="form-field">
            <label for="u-correo">Correo electrónico</label>
            <input type="email" id="u-correo" maxlength="100" required>
          </div>
          <div class="form-field">
            <label for="u-tipo">Tipo de usuario</label>
            <select id="u-tipo" required>
              <option value="Cliente">Cliente</option>
              <option value="Vendedor">Vendedor (arrendador)</option>
              <option value="Administrador">Administrador</option>
            </select>
          </div>
        </div>
        <div class="form-row-2">
          <div class="form-field">
            <label for="u-region">Región</label>
            <select id="u-region" required></select>
          </div>
          <div class="form-field">
            <label for="u-comuna">Comuna</label>
            <select id="u-comuna" required disabled></select>
          </div>
        </div>
        <div class="form-field">
          <label for="u-direccion">Dirección</label>
          <input type="text" id="u-direccion" maxlength="300" required>
        </div>
        <div class="form-field">
          <label for="u-clave">Contraseña</label>
          <input type="password" id="u-clave" minlength="4" maxlength="10" placeholder="Entre 4 y 10 caracteres" required>
        </div>
        <button type="submit" class="btn btn-primary btn-block">Guardar usuario</button>
      </div>
    </form>
  </main>
</div>

<script defer src="../../js/lib/manifest.js"></script>
<script defer src="../../js/store.js"></script>
<script defer src="../../js/validators.js"></script>
<script defer src="../../js/region-comuna.js"></script>
<script defer src="../../js/main.js"></script>
<script defer src="../../js/admin-common.js"></script>
<script defer src="../../js/admin-usuario-form.js?v=20260922"></script>
</body>
</html>
